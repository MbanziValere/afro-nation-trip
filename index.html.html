<!doctype html>
<!--
DATABASE (only needed later, when you connect Supabase). Run once in Supabase SQL Editor:

create table public.expenses(id uuid primary key default gen_random_uuid(),description text,amount numeric(12,2) not null check(amount>0),category text not null,paid_by text not null,spent_on date not null,created_at timestamptz default now());
create table public.claims(person text primary key,device text not null,created_at timestamptz default now());
alter table public.expenses enable row level security; alter table public.claims enable row level security;
create policy "all expenses" on public.expenses for all to anon using(true) with check(true);
create policy "all claims" on public.claims for all to anon using(true) with check(true);
grant select,insert,update,delete on public.expenses,public.claims to anon;
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afro Nation · Trip Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050410;--card:rgba(255,255,255,.045);--ln:rgba(255,255,255,.09);--ink:#f7f2ff;--mu:#9892bb;--ac:#ff4f8b;--ac2:#ffb338;--ok:#2ee6c5;--bad:#ff6b7a;--okbg:rgba(46,230,197,.15);--badbg:rgba(255,107,122,.16);--inp:rgba(255,255,255,.055);--nav:rgba(12,10,30,.85);--glowA:#ff4f8b30;--glowB:#ffb33818}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0;min-height:100vh;
background:radial-gradient(900px 520px at 90% -8%,var(--glowA),transparent 62%),radial-gradient(700px 520px at -12% 12%,var(--glowB),transparent 58%),var(--bg);background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}
h1{font:800 clamp(2rem,9vw,2.8rem)/1 "Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.04em;margin:8px 0 8px}
h2{font:700 1.1rem "Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.01em;margin:0 0 12px}
.mu{color:var(--mu)}.sm{font-size:.84rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:18px;margin-bottom:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hero{background:linear-gradient(135deg,#ff4f8b 0%,#ff8a3d 58%,#ffc23d 100%);border:0;color:#2b0f2f;padding:24px 22px;border-radius:28px;box-shadow:0 18px 60px -22px #ff4f8b}
.hero .mu{color:#5a2243}
.big{font:800 clamp(2.8rem,15vw,4.2rem)/1 "Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.05em;margin:6px 0}
.banner{background:var(--badbg);color:var(--bad);border:1px solid var(--ln);border-radius:14px;padding:9px 14px;font-size:.84rem;margin:10px 0}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(400px,calc(100% - 28px));display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);box-shadow:0 12px 40px -10px #000a;z-index:10}
.tab{flex:1;border:0;background:transparent;color:var(--mu);border-radius:99px;padding:11px 6px;font:600 .92rem "DM Sans",system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#2b0f2f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--mu);margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--inp);color:var(--ink);font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
select option{background:#12102a;color:#f7f2ff}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glowA)}
#amt{font:800 2.2rem "Bricolage Grotesque","DM Sans",sans-serif;letter-spacing:-.03em;padding:14px 16px}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#2b0f2f;border:0;border-radius:16px;padding:14px 22px;font:700 1rem "DM Sans",system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 26px -10px var(--ac)}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--inp);color:var(--mu);border:1px solid var(--ln);font-weight:600;padding:8px 14px;font-size:.84rem;box-shadow:none;border-radius:99px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{padding:16px 10px;border-radius:18px;border:1px solid var(--ln);background:var(--inp);color:var(--ink);font:700 1rem "DM Sans",system-ui,sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.who button:hover:not(:disabled){border-color:var(--ac);background:var(--glowA)}
.who button:disabled{opacity:.35;cursor:not-allowed}
.cat{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 0;cursor:pointer;font:inherit}
.bar{height:10px;border-radius:6px;background:var(--inp);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.p{padding:14px 0;border-bottom:1px solid var(--ln)}.p:last-child{border:0}
.nm{display:flex;align-items:center;gap:11px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 1rem "Bricolage Grotesque",sans-serif;font-style:normal;color:#22123f;background:hsl(var(--h) 92% 70%);flex:none}
.tag{font-weight:800;padding:6px 13px;border-radius:99px;white-space:nowrap;font-size:.92rem}
.get{background:var(--okbg);color:var(--ok)}.owe{background:var(--badbg);color:var(--bad)}.even{background:var(--inp);color:var(--mu)}
.p.me{padding:16px;margin:0 -4px 10px;border:1px solid var(--ac);border-radius:20px;background:linear-gradient(135deg,var(--glowA),transparent)}
details summary{cursor:pointer;color:var(--ac2);font-size:.86rem;font-weight:600;margin-top:8px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";transition:transform .2s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
.calc{font-size:.9rem;background:var(--inp);border-radius:16px;padding:12px 14px;margin-top:8px}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Afro Nation<br>trip money</h1>
<div class="mu sm">Every expense is split equally between all 9 people.</div>
<div id="banner"></div>
<div id="app"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== SETTINGS: edit these ===== */
const CONFIG={SUPABASE_URL:"",SUPABASE_KEY:"",OWNER_PIN:"1234"};
const PEOPLE=["Mbanzi","Dede","Optime","Emmy","Parfait","Divine","Hirwa","Benefique","Vera"];
const CATS={"Accommodation":"🏡","Food & drinks":"🍽️","Transport":"🚕","Activities":"🎟️","Groceries":"🛒","Other":"🧾"};
const N=PEOPLE.length;
/* ================================ */
const $=s=>document.querySelector(s),ls=localStorage;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR"}).format(n);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dev=ls.tripDevice||(ls.tripDevice=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)));
const cloud=CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY?window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY):null;
let S={exp:[],claims:[]},me=ls.tripMe||null,tab="sum",owner=false,filter=null,sig="",open=new Set();

async function load(){
 if(cloud){const[e,c]=await Promise.all([cloud.from("expenses").select("*").order("created_at",{ascending:false}),cloud.from("claims").select("*").order("created_at")]);
  if(e.error||c.error){$("#banner").innerHTML='<div class="banner">Cannot reach the database. Showing the last data.</div>';return}
  $("#banner").innerHTML="";S={exp:e.data.map(x=>({...x,amount:Number(x.amount)})),claims:c.data}}
 else{S={exp:JSON.parse(ls.tripExp||"[]"),claims:JSON.parse(ls.tripClaims||"[]")};
  $("#banner").innerHTML='<div class="banner">Preview mode: no database connected, so data stays on this device only.</div>'}
 if(me&&!S.claims.some(c=>c.person===me&&c.device===dev)){me=null;delete ls.tripMe}
 const s=JSON.stringify(S)+me+tab+owner+filter;if(s!==sig){sig=s;if(tab!=="add")render()}
}
async function claim(p){
 if(cloud){const{error}=await cloud.from("claims").insert({person:p,device:dev});if(error){alert("That name was just taken.");return load()}}
 else{if(S.claims.some(c=>c.person===p))return;S.claims.push({person:p,device:dev});ls.tripClaims=JSON.stringify(S.claims)}
 me=p;ls.tripMe=p;await load();sig="";render()
}
async function release(p){
 if(cloud)await cloud.from("claims").delete().eq("person",p);
 else{S.claims=S.claims.filter(c=>c.person!==p);ls.tripClaims=JSON.stringify(S.claims)}
 load()
}
async function addExp(r){
 if(cloud){const{error}=await cloud.from("expenses").insert(r);if(error)return alert("Could not save: "+error.message)}
 else{S.exp.unshift({...r,id:Date.now()+"",created_at:new Date().toISOString()});ls.tripExp=JSON.stringify(S.exp)}
 await load();sig="";render()
}
async function delExp(id){
 if(!confirm("Delete this expense?"))return;
 if(cloud)await cloud.from("expenses").delete().eq("id",id);
 else{S.exp=S.exp.filter(e=>e.id!==id);ls.tripExp=JSON.stringify(S.exp)}
 await load();sig="";render()
}

function calc(){
 const total=S.exp.reduce((a,e)=>a+e.amount,0),share=total/N,paid={},cat={};
 PEOPLE.forEach(p=>paid[p]=0);
 S.exp.forEach(e=>{if(e.paid_by in paid)paid[e.paid_by]+=e.amount;cat[e.category]=(cat[e.category]||0)+e.amount});
 return{total,share,paid,cat}
}
function line(p,c){
 const net=Math.round((c.paid[p]-c.share)*100)/100;
 const tag=net>0?`<span class="tag get">Gets back ${eur(net)}</span>`:net<0?`<span class="tag owe">Owes ${eur(-net)}</span>`:`<span class="tag even">Settled</span>`;
 const mine=S.exp.filter(e=>e.paid_by===p);
 const w=net>0?"Paid minus share = gets back":net<0?"Share minus paid = owes":"Paid equals share";
 return`<div class="p${p===me?" me":""}"><div class="row"><span class="nm"><i class="av" style="--h:${PEOPLE.indexOf(p)*40+330}">${esc(p[0])}</i><b>${esc(p)}${p===me?" (you)":""}</b></span>${tag}</div>
 <details data-p="${esc(p)}" ${open.has(p)?"open":""}><summary>Show calculation</summary><div class="calc">
 <div><span>Total group spending</span><span>${eur(c.total)}</span></div>
 <div><span>Share = total ÷ ${N}</span><span>${eur(c.share)}</span></div>
 <div><span>${esc(p)} paid in total</span><span>${eur(c.paid[p])}</span></div>
 ${mine.map(e=>`<div class="mu sm"><span>· ${esc(e.description||e.category)} (${esc(e.spent_on)})</span><span>${eur(e.amount)}</span></div>`).join("")}
 <div><b>${w}</b><b>${eur(Math.abs(net))}</b></div></div></details></div>`
}
function viewSum(){
 const c=calc(),cats=Object.entries(c.cat).sort((a,b)=>b[1]-a[1]);
 return`<div class="card hero"><div class="mu sm">Total spent</div><div class="big">${eur(c.total)}</div><div class="mu sm">${S.exp.length} expense${S.exp.length===1?"":"s"} · fair share per person ${eur(c.share)}</div></div>
 <div class="card"><h2>Spent on</h2>${cats.length?cats.map(([k,v])=>`<button class="cat" data-cat="${esc(k)}"><div class="row"><span>${CATS[k]||"🧾"} ${esc(k)}</span><span>${eur(v)} · ${Math.round(v/c.total*100)}%</span></div><div class="bar"><i style="width:${v/c.total*100}%"></i></div></button>`).join(""):'<span class="mu">Nothing yet.</span>'}</div>
 <div class="card"><h2>Who owes, who gets back</h2>${[me,...PEOPLE.filter(p=>p!==me)].map(p=>line(p,c)).join("")}</div>`
}
function viewAdd(){
 return`<div class="card"><h2>Add an expense</h2><label>Amount (€)</label><input id="amt" type="text" inputmode="decimal" placeholder="0.00" autofocus>
 <div class="grid2"><div><label>Category</label><select id="cat">${Object.keys(CATS).map(k=>`<option>${esc(k)}</option>`).join("")}</select></div><div><label>Paid by</label><select id="payer">${PEOPLE.map(p=>`<option ${p===me?"selected":""}>${esc(p)}</option>`).join("")}</select></div></div>
 <label>Description (optional)</label><input id="desc" maxlength="80" placeholder="e.g. Taxi to the festival"><label>Date</label><input id="date" type="date" value="${today()}">
 <div style="margin-top:14px"><button class="btn" id="save">Add expense</button> <span id="err" style="color:var(--bad)"></span></div>
 <div class="mu sm" style="margin-top:10px">Split equally between all ${N} people.</div></div>`
}
function viewList(){
 const rows=S.exp.filter(e=>!filter||e.category===filter).slice().sort((a,b)=>(b.spent_on+b.created_at).localeCompare(a.spent_on+a.created_at));
 return`<div class="card"><div class="row"><h2>All spending${filter?": "+esc(filter):""}</h2>${filter?'<button class="btn g" id="clr">Show all</button>':""}</div>
 ${rows.length?rows.map(e=>`<div class="p row"><div><b>${CATS[e.category]||"🧾"} ${esc(e.description||e.category)}</b><div class="mu sm">Paid by ${esc(e.paid_by)} · ${esc(e.category)} · ${esc(e.spent_on)}</div></div><div style="text-align:right"><b>${eur(e.amount)}</b>${e.paid_by===me||owner?`<br><button class="btn g" data-del="${esc(e.id)}">Delete</button>`:""}</div></div>`).join(""):'<span class="mu">No expenses yet.</span>'}</div>
 <div class="card"><button class="btn g" id="csv">Download CSV</button> <button class="btn g" id="org">${owner?"Leave organizer mode":"Organizer"}</button>
 ${owner?`<h2 style="margin-top:14px">Names on devices</h2>${PEOPLE.map(p=>{const c=S.claims.find(x=>x.person===p);return`<div class="row p"><span>${esc(p)} <span class="mu sm">${c?"taken":"free"}</span></span>${c?`<button class="btn g" data-rel="${esc(p)}">Release</button>`:""}</div>`}).join("")}`:""}</div>`
}
function viewWho(){
 const taken=new Set(S.claims.map(c=>c.person));
 return`<div class="card"><h2>Who are you?</h2><div class="mu sm" style="margin-bottom:10px">Choose your name once. It is saved on this device and only the organizer can change it.</div><div class="who">${PEOPLE.map(p=>`<button data-who="${esc(p)}" ${taken.has(p)?"disabled":""}>${esc(p)}${taken.has(p)?"<br><span class='sm mu'>taken</span>":""}</button>`).join("")}</div></div>`
}
function render(){
 const a=$("#app");
 if(!me){a.innerHTML=viewWho();a.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>claim(b.dataset.who));return}
 const T=[["sum","Summary"],["add","＋ Add"],["list","Spending"]];
 a.innerHTML=`<div class="tabs">${T.map(([k,v])=>`<button class="tab ${tab===k?"on":""}" data-t="${k}">${v}</button>`).join("")}</div>`+(tab==="sum"?viewSum():tab==="add"?viewAdd():viewList());
 a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;sig="";render()});
 a.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filter=b.dataset.cat;tab="list";sig="";render()});
 a.querySelectorAll("details[data-p]").forEach(d=>d.ontoggle=()=>d.open?open.add(d.dataset.p):open.delete(d.dataset.p));
 a.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delExp(b.dataset.del));
 a.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>confirm("Release "+b.dataset.rel+"?")&&release(b.dataset.rel));
 const g=id=>document.getElementById(id);
 if(g("clr"))g("clr").onclick=()=>{filter=null;sig="";render()};
 if(g("org"))g("org").onclick=()=>{if(owner)owner=false;else if(prompt("Organizer PIN")===CONFIG.OWNER_PIN)owner=true;else return alert("Wrong PIN");sig="";render()};
 if(g("csv"))g("csv").onclick=()=>{const r=[["Date","Description","Category","Paid by","Amount EUR"],...S.exp.map(e=>[e.spent_on,e.description||"",e.category,e.paid_by,e.amount.toFixed(2)])];
  const x=r.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),A=document.createElement("a");A.href=URL.createObjectURL(new Blob([x],{type:"text/csv"}));A.download="trip-expenses.csv";A.click()};
 if(g("save"))g("save").onclick=()=>{const v=parseFloat(g("amt").value.replace(",",".")),err=g("err");
  if(!(v>0)){err.textContent="Enter an amount.";return}
  addExp({description:g("desc").value.trim(),amount:Math.round(v*100)/100,category:g("cat").value,paid_by:g("payer").value,spent_on:g("date").value||today()});tab="sum"};
}
load();setInterval(()=>{if(!document.hidden&&!(tab==="add"&&document.activeElement&&document.activeElement.tagName==="INPUT"))load()},6000);
</script>
</body>
</html>
